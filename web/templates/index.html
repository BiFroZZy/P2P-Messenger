{{ define "index.html" }}

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
  <title>Messenger | {{.Title}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #434c4e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1c1c1e;
      line-height: 1.5;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 120px 40px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02), 0 0 0 1px rgba(0, 0, 0, 0.01);
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 520;
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
      color: #0a0a0b;
      line-height: 1.2;
    }
    .subhead {
      font-size: 1rem;
      color: #6b6b6f;
      border-left: 2.5px solid #e2e2e0;
      padding-left: 14px;
      margin-bottom: 1.8rem;
      font-weight: 400;
    }
    p {
      font-size: 0.98rem;
      color: #2c2c2e;
      margin-bottom: 1.5rem;
    }
    .divider {
      width: 48px;
      height: 2px;
      background-color: #e5e5e3;
      margin: 1.5rem 0 1.5rem 0;
      border-radius: 2px;
    }
    .info-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
      margin: 1rem 0 0.5rem 0;
    }
    .info-block {
      flex: 1;
      min-width: 130px;
    }
    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8e8e93;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 0.96rem;
      font-weight: 450;
      color: #1c1c1e;
    }

    /* исправленная кнопка — активная, рабочая */
    .btn-auth {
      display: inline-block;
      background: #007aff;
      border: none;
      padding: 10px 28px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: white;
      text-decoration: none;
      font-family: inherit;
      margin-top: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-auth:hover {
      background: #0051b3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .btn-auth:active {
      transform: translateY(0);
    }

    /* подвал */
    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 0.7rem;
      color: #9c9ca0;
      letter-spacing: 0.2px;
    }

    /* адаптив для узких экранов */
    @media (max-width: 480px) {
      body {
        padding: 14px 12px;
      }
      .card {
        padding: 24px 20px;
        border-radius: 24px;
      }
      h1 {
        font-size: 1.75rem;
      }
      .subhead {
        font-size: 0.9rem;
        margin-bottom: 1.4rem;
      }
      .info-grid {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Ваши<br>сообщения</h1>
    <div class="subhead">минимализм как способ видеть главное</div>

    <p>
      Мессенджер на Golang
    </p>

    <div class="divider"></div>

    <div class="info-grid">
      <div class="info-block">
        <div class="info-label">подход</div>
        <div class="info-value">минимализм · эссенция</div>
      </div>
      <div class="info-block">
        <div class="info-label">атмосфера</div>
        <div class="info-value">свет · воздух · ритм</div>
      </div>
      <div class="info-block">
        <div class="info-label">форма</div>
        <div class="info-value">чистота · баланс</div>
      </div>
    </div>

    <!-- исправленная кнопка авторизации -->
    <a href="/public/auth" class="btn-auth">Авторизация</a>
    <a href="/users/messages" class="btn-auth">Сообщения</a>
  </div>
</div>
</body>
</html>
{{ end }}
