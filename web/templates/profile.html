{{ define "profile.html" }}

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
  <title>Messenger | {{.Title}}</title>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #434c4e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1c1c1e;
      line-height: 1.5;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 720px;
      width: 100%;
      height: calc(100vh - 40px);
      min-height: 500px;
      margin: 0 auto;
      position: relative;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 40px 40px 100px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02), 0 0 0 1px rgba(0, 0, 0, 0.01);
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Навигация слева сверху — вертикальная колонка */
    .nav-top-left {
      position: absolute;
      top: 28px;
      left: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .profile-nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: #b0b0b1;
      color: #000000;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 18px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .nav-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f2f2f4;
      color: #1c1c1e;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 18px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .nav-icon:hover {
      background: #007aff;
      color: white;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
    }

    .nav-icon:active {
      transform: scale(0.95);
    }

    .nav-icon.active {
      background: #007aff;
      color: white;
    }
    .nav-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Центральный контент */
    .center-content {
      display: flex;
      align-items: center;
      flex: 1;
      margin-bottom: 80%;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 520;
      letter-spacing: -0.02em;
      margin-bottom: 0.65rem;
      color: #0a0a0b;
      line-height: 1.2;
    }

    /* Блок справа с информацией о пользователе */
    .right-info {
      position: absolute;
      top: 30px;
      right: 60px;
      text-align: right;
    }

    .user-name {
      font-size: 30px;
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 4px;
    }

    .user-nick {
      font-size: 25px;
      color: #1c1c1e;
      margin-bottom: 4px;
    }

    .user-email {
      font-size: 25px;
      color: #1c1c1e;
    }
    .user-created {
      font-size: 25px;
      color: #1c1c1e;
    }
    .divider {
      width: 48px;
      height: 2px;
      background-color: #e5e5e3;
      margin: 1.5rem auto 1.5rem auto;
      border-radius: 2px;
    }

    .footer-note {
      margin-top: auto;
      text-align: center;
      font-size: 0.7rem;
      color: #9c9ca0;
      letter-spacing: 0.2px;
      padding-top: 20px;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .container {
        height: calc(100vh - 24px);
        min-height: 400px;
      }
      .card {
        padding: 30px 20px 30px 80px;
        border-radius: 24px;
      }
      .nav-top-left {
        top: 20px;
        left: 16px;
        gap: 10px;
      }
      .nav-icon {
        width: 38px;
        height: 38px;
      }
      .nav-icon svg {
        width: 19px;
        height: 19px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .right-info {
        top: 20px;
        right: 16px;
      }
      .user-name {
        font-size: 1rem;
      }
      .user-nick {
        font-size: 0.8rem;
      }
      .user-email {
        font-size: 0.75rem;
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 16px 24px 68px;
        border-radius: 20px;
      }
      .nav-top-left {
        top: 16px;
        left: 12px;
        gap: 8px;
      }
      .nav-icon {
        width: 34px;
        height: 34px;
      }
      .nav-icon svg {
        width: 17px;
        height: 17px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .right-info {
        top: 16px;
        right: 12px;
      }
      .user-name {
        font-size: 0.9rem;
      }
      .user-nick {
        font-size: 0.7rem;
      }
      .user-email {
        font-size: 0.65rem;
      }
    }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="nav-top-left">
      <a href="/users/{{.UserID}}/profile" class="nav-icon" title="Профиль">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <a href="/users/{{.UserID}}/messages" class="nav-icon" title="Сообщения">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </a>
      <a href="/public/auth" class="nav-icon" title="Авторизация">
        <svg viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>

          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
      </a>
    </div>

    <div class="right-info">
        <svg viewBox="0 0 24 24" class="profile-nav-icon">
          <path d="M20 24v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="12" r="5"/>
        </svg>
      <div class="user-nick">Ник:{{.Nickname}}</div>
      <div class="user-email">Почта:{{.Email}}</div>
      <!-- <div class="user-created">Дата создания:{{.CreatedAt}}</div> -->
    </div>

    <div class="center-content">
      <h1>Ваш<br>профиль</h1>
    </div>
  </div>
</div>
</body>
</html>
{{ end }}
